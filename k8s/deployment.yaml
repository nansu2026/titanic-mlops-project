apiVersion: apps/v1
kind: Deployment
metadata:
  name: titanic-mlops-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: titanic-mlops-app
  template:
    metadata:
      labels:
        app: titanic-mlops-app
    spec:
      containers:
        - name: titanic-mlops-app
          image: titanic-mlops-app:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"