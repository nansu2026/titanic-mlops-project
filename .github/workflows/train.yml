name: Continuous Training, Docker Build and Kubernetes Deployment

on:
  push:
    branches: [main]
    paths:
      - "data/**"
      - "src/**"
      - "app.py"
      - "requirements.txt"
      - "Dockerfile"
      - "k8s/**"
      - ".github/workflows/train.yml"

  pull_request:
    branches: [main]

  schedule:
    - cron: "0 0 * * 0"

  workflow_dispatch:

env:
  IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/titanic-mlops
  IMAGE_TAG: latest

jobs:
  continuous-training:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create required folders
        run: |
          mkdir -p models metrics mlruns

      - name: Run data validation
        run: |
          python src/data_validation.py

      - name: Check data drift and trigger continuous training
        env:
          MLFLOW_TRACKING_URI: file:./mlruns
        run: |
          python src/continuous_training_trigger.py

      - name: Ensure model exists
        run: |
          test -f models/best_model.pkl

      - name: Run tests
        run: |
          pytest tests/

      - name: Upload trained model artifacts
        uses: actions/upload-artifact@v4
        with:
          name: trained-model-artifacts
          path: |
            models/
            metrics/
            mlruns/

  docker-build-and-push:
    needs: continuous-training
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download trained model artifacts
        uses: actions/download-artifact@v4
        with:
          name: trained-model-artifacts
          path: .

      - name: Verify trained model is inside Docker build context
        run: |
          ls -lah models/
          test -f models/best_model.pkl

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image with latest trained model
        run: |
          docker build -t $IMAGE_NAME:$IMAGE_TAG .

      - name: Push Docker image
        run: |
          docker push $IMAGE_NAME:$IMAGE_TAG

  kubernetes-deployment:
    needs: docker-build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create local Kubernetes cluster
        uses: helm/kind-action@v1.10.0

      - name: Deploy application to Kubernetes
        run: |
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml
          kubectl apply -f k8s/hpa.yaml

      - name: Verify Kubernetes deployment
        run: |
          kubectl rollout status deployment/titanic-mlops-app --timeout=300s || true

          echo "=== PODS ==="
          kubectl get pods -o wide

          echo "=== DESCRIBE PODS ==="
          kubectl describe pods

          echo "=== LOGS ==="
          kubectl logs -l app=titanic-mlops-app --all-containers=true --tail=100 || true

          echo "=== SERVICES ==="
          kubectl get svc

          echo "=== HPA ==="
          kubectl get hpa

        