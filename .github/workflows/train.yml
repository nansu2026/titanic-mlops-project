name: Continuous Training and ML Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

  # Automatic weekly retraining
  schedule:
    - cron: '0 0 * * 0'

  # Manual trigger
  workflow_dispatch:

jobs:
  train-and-validate:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Setup Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Step 3: Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Step 4: Run preprocessing
      - name: Run preprocessing
        run: |
          python src/preprocess.py

      # Step 5: Run training pipeline
      - name: Train model with MLflow tracking
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
          MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}
        run: |
          python src/train.py

      # Step 6: Run continuous training trigger
      - name: Drift-triggered continuous training with MLflow
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
          MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}
        run: |
          python src/continuous_training_trigger.py

      # Step 7: Run tests
      - name: Run unit tests
        run: |
          pytest tests/

      # Step 8: Upload trained model artifact
      - name: Upload trained model
        uses: actions/upload-artifact@v4
        with:
          name: trained-model
          path: |
            models/
            mlruns/

  docker-build-and-push:
    needs: train-and-validate
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Login to DockerHub
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Step 3: Build Docker image
      - name: Build Docker image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/titanic-mlops:latest .

      # Step 4: Push Docker image
      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/titanic-mlops:latest

  kubernetes-deployment:
    needs: docker-build-and-push
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Setup kubectl
      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      # Step 3: Configure Kubernetes credentials
      - name: Configure kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG }}" > $HOME/.kube/config

      # Step 4: Deploy to Kubernetes
      - name: Deploy application to Kubernetes
        run: |
          kubectl apply -f k8s/

      # Step 5: Verify deployment rollout
      - name: Verify Kubernetes deployment
        run: |
          kubectl rollout status deployment/titanic-mlops-deployment

      # Step 6: Check pods and services
      - name: Kubernetes cluster status
        run: |
          kubectl get pods
          kubectl get svc
          kubectl get hpa