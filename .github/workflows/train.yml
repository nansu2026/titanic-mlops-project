name: Continuous Training Pipeline

on:
  push:
    paths:
      - "data/**"
      - "src/**"
      - "config.yaml"
      - "requirements.txt"
      - "tests/**"

  schedule:
    - cron: "0 0 * * 0"

  workflow_dispatch:

jobs:
  retrain-model:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Step 3: Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Step 4: Create directories
      - name: Create required directories
        run: |
          mkdir -p models
          mkdir -p metrics
          mkdir -p mlruns

      # Step 5: Run continuous training pipeline
      - name: Train model with MLflow
        run: |
          python src/train.py

      # Step 6: Verify model creation
      - name: Verify trained model exists
        run: |
          ls -la models/
          test -f models/best_model.pkl

      # Step 7: Upload trained model artifact
      - name: Upload trained model
        uses: actions/upload-artifact@v4
        with:
          name: trained-model
          path: models/

      # Step 8: Upload metrics artifact
      - name: Upload metrics
        uses: actions/upload-artifact@v4
        with:
          name: metrics
          path: metrics/

      # Step 9: Upload MLflow experiment tracking
      - name: Upload MLflow runs
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-runs
          path: mlruns/