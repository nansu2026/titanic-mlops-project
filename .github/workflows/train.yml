name: Continuous Training

on:
  push:
    paths:
      - "data/**"
      - "src/**"
      - "config.yaml"
  workflow_dispatch:

jobs:
  train:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run automatic model training
        run: |
          python src/train.py

      - name: Run tests after training
        run: |
          pytest

      - name: Commit updated model, metrics, and MLflow metadata
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git add models/ metrics/ mlruns/
          git commit -m "Automatic model retraining after data or code change" || echo "No changes to commit"
          git push