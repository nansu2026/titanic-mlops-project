name: Continuous Training Pipeline

on:
  push:
    paths:
      - "data/**"
      - "src/**"
      - "config.yaml"
      - "requirements.txt"
      - "tests/**"
  workflow_dispatch:

jobs:
  continuous-training:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests before training
        run: |
          pytest

      - name: Train model with MLflow
        run: |
          python src/train.py

      - name: Upload trained model and metrics
        uses: actions/upload-artifact@v4
        with:
          name: trained-model-and-metrics
          path: |
            models/
            metrics/
            mlruns/

      - name: Show model registry
        run: |
          cat models/model_registry.json

      - name: Show training results
        run: |
          cat metrics/model_results.json