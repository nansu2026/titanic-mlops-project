name: MLOps Continuous Training and Kubernetes Deployment Pipeline

on:
  push:
    branches:
      - main
    paths:
      - "data/**"
      - "src/**"
      - "app.py"
      - "config.yaml"
      - "requirements.txt"
      - "Dockerfile"
      - "k8s/**"
      - "tests/**"

  schedule:
    - cron: "0 0 * * 0"

  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/titanic-mlops-app
  IMAGE_TAG: ${{ github.sha }}

jobs:
  mlops-training-and-kubernetes-deployment:
    name: Train Model, Build Docker Image and Deploy to Kubernetes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create required folders
        run: |
          mkdir -p models metrics mlruns

      - name: Run data validation
        run: |
          python src/data_validation.py

      - name: Continuous training with MLflow
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
          MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}
        run: |
          python src/train.py

      - name: Verify generated ML artifacts
        run: |
          test -f models/best_model.pkl
          test -f models/model_registry.json
          test -f metrics/model_results.json
          test -f metrics/data_version.json
          test -f metrics/drift_report.json
          test -f metrics/reference_data_profile.json
          test -f metrics/reference_dataset.csv
          cat metrics/drift_report.json
          cat models/model_registry.json

      - name: Run tests after training
        run: |
          pytest -q

      - name: Upload trained model, metrics and MLflow runs
        uses: actions/upload-artifact@v4
        with:
          name: training-artifacts-${{ github.sha }}
          path: |
            models/
            metrics/
            mlruns/

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image containing latest trained model
        run: |
          docker build -t $IMAGE_NAME:$IMAGE_TAG -t $IMAGE_NAME:latest .

      - name: Push Docker image
        run: |
          docker push $IMAGE_NAME:$IMAGE_TAG
          docker push $IMAGE_NAME:latest

      - name: Check Kubernetes secret availability
        run: |
          if [ -z "${KUBE_CONFIG_BASE64}" ]; then
            echo "USE_KIND=true" >> $GITHUB_ENV
          else
            echo "USE_KIND=false" >> $GITHUB_ENV
          fi
        env:
          KUBE_CONFIG_BASE64: ${{ secrets.KUBE_CONFIG }}

      - name: Configure real Kubernetes cluster
        if: env.USE_KIND == 'false'
        run: |
          mkdir -p ~/.kube
          echo "${KUBE_CONFIG_BASE64}" | base64 -d > ~/.kube/config
          kubectl cluster-info
        env:
          KUBE_CONFIG_BASE64: ${{ secrets.KUBE_CONFIG }}

      - name: Install KIND fallback cluster
        if: env.USE_KIND == 'true'
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/v0.23.0/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind
          kind create cluster --name titanic-cluster
          kind load docker-image $IMAGE_NAME:$IMAGE_TAG --name titanic-cluster

      - name: Install metrics-server for HPA
        run: |
          kubectl apply -f https://github.com/kubernetes-sigs/metrics-server/releases/latest/download/components.yaml || true
          kubectl patch deployment metrics-server -n kube-system --type='json' \
            -p='[{"op":"add","path":"/spec/template/spec/containers/0/args/-","value":"--kubelet-insecure-tls"}]' || true

      - name: Deploy latest model to Kubernetes
        run: |
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml
          kubectl apply -f k8s/hpa.yaml
          kubectl set image deployment/titanic-mlops-app titanic-mlops-app=$IMAGE_NAME:$IMAGE_TAG
          kubectl rollout status deployment/titanic-mlops-app --timeout=180s
          kubectl get pods
          kubectl get svc
          kubectl get hpa

      - name: Kubernetes health check
        run: |
          kubectl port-forward service/titanic-mlops-service 5000:80 &
          sleep 10
          curl --fail http://localhost:5000/health