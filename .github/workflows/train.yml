name: Continuous Training and ML Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  schedule:
    - cron: '0 0 * * 0'

  workflow_dispatch:

jobs:

  train-and-validate:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create metrics directory
        run: |
          mkdir -p metrics

      - name: Create empty reference profile if missing
        run: |
          if [ ! -f metrics/reference_data_profile.json ]; then
            echo "{}" > metrics/reference_data_profile.json
          fi

      - name: Run preprocessing
        run: |
          python src/preprocess.py

      - name: Train model with MLflow tracking
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
          MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}
        run: |
          python src/train.py

      - name: Drift-triggered continuous training with MLflow
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
          MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}
        run: |
          python src/continuous_training_trigger.py

      - name: Run unit tests
        run: |
          pytest tests/

      - name: Upload trained model artifacts
        uses: actions/upload-artifact@v4
        with:
          name: trained-model
          path: |
            models/
            metrics/
            mlruns/

  docker-build-and-push:
    needs: train-and-validate
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/titanic-mlops:latest .

      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/titanic-mlops:latest

    kubernetes-deployment:
    needs: docker-build-and-push
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Kubernetes manifest YAML files
        run: |
          python - <<'PY'
          import yaml
          from pathlib import Path

          files = [
              "k8s/deployment.yaml",
              "k8s/service.yaml",
              "k8s/hpa.yaml"
          ]

          for file in files:
              path = Path(file)

              if not path.exists():
                  raise FileNotFoundError(f"Missing Kubernetes file: {file}")

              with open(path, "r") as f:
                  docs = list(yaml.safe_load_all(f))

              for doc in docs:
                  if not doc:
                      continue
                  assert "apiVersion" in doc, f"{file} missing apiVersion"
                  assert "kind" in doc, f"{file} missing kind"
                  assert "metadata" in doc, f"{file} missing metadata"

              print(f"Validated Kubernetes manifest: {file}")

          print("All Kubernetes manifests are valid YAML files.")
          PY