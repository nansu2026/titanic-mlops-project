name: Kubernetes Deployment

on:
  workflow_dispatch:

jobs:
  deploy-to-kind:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create local Kubernetes cluster using Kind
        uses: helm/kind-action@v1

      - name: Build Docker image
        run: |
          docker build -t titanic-mlops-app:latest .

      - name: Load Docker image into Kind
        run: |
          kind load docker-image titanic-mlops-app:latest

      - name: Apply Kubernetes manifests
        run: |
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml

      - name: Check Kubernetes deployment
        run: |
          kubectl rollout status deployment/titanic-mlops-app
          kubectl get pods
          kubectl get services