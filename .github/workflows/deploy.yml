name: Continuous Deployment

on:
  push:
    branches:
      - main

jobs:
  docker-build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t titanic-mlops-app:latest .

      - name: Run Docker container
        run: |
          docker run -d -p 5000:5000 --name titanic-container titanic-mlops-app:latest
          sleep 10

      - name: Test health endpoint
        run: |
          curl --fail http://localhost:5000/health

      - name: Test prediction endpoint
        run: |
          curl --fail -X POST http://localhost:5000/predict \
          -H "Content-Type: application/json" \
          -d '{"Pclass":3,"Sex":"male","Age":25,"Fare":7.25,"Embarked":"S"}'

      - name: Stop Docker container
        run: |
          docker stop titanic-container