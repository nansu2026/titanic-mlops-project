name: Kubernetes Deployment Pipeline

on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types:
      - completed

  workflow_dispatch:

jobs:
  docker-and-kind-deploy:

    runs-on: ubuntu-latest

    steps:

      # =========================
      # Checkout Repository
      # =========================
      - name: Checkout repository
        uses: actions/checkout@v4

      # =========================
      # Set up Python
      # =========================
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # =========================
      # Install dependencies
      # =========================
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # =========================
      # Train model
      # =========================
      - name: Train model
        run: |
          python src/train.py

      # =========================
      # Build Docker image
      # =========================
      - name: Build Docker image
        run: |
          docker build -t titanic-mlops-app:latest .

      # =========================
      # Install KIND
      # =========================
      - name: Install KIND
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/v0.23.0/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind

      # =========================
      # Create Kubernetes cluster
      # =========================
      - name: Create KIND cluster
        run: |
          kind create cluster --name titanic-cluster

      # =========================
      # Load Docker image into KIND
      # =========================
      - name: Load Docker image into KIND
        run: |
          kind load docker-image titanic-mlops-app:latest --name titanic-cluster

      # =========================
      # Deploy to Kubernetes
      # =========================
      - name: Apply Kubernetes manifests
        run: |
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml
          kubectl apply -f k8s/hpa.yaml

      # =========================
      # Wait for deployment
      # =========================
      - name: Wait for deployment
        run: |
          kubectl rollout status deployment/titanic-mlops-app

      # =========================
      # Check Kubernetes resources
      # =========================
      - name: Check Kubernetes resources
        run: |
          kubectl get pods
          kubectl get svc
          kubectl get hpa

      # =========================
      # Port forward application
      # =========================
      - name: Start port forwarding
        run: |
          kubectl port-forward service/titanic-mlops-service 5000:80 &
          sleep 10

      # =========================
      # Health Check
      # =========================
      - name: Health check
        run: |
          curl http://localhost:5000/health

      # =========================
      # API Test
      # =========================
      - name: Prediction API test
        run: |
          curl -X POST http://localhost:5000/predict \
          -H "Content-Type: application/json" \
          -d '{"Pclass":3,"Sex":"male","Age":22,"Fare":7.25,"Embarked":"S"}'